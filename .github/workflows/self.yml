name: Autopilot
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fixture — lying SHA must REJECT
        env:
          AUTOPILOT_DEMO: lying
        run: |
          set +e
          node --experimental-strip-types cli.ts
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(cat out/verdict.txt)" = "REJECT"
